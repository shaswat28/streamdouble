[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamdouble"
version = "0.2.0"
description = "A framework-agnostic Twilio Media Streams simulator. Test your voice agent's WebSocket endpoint locally, at full protocol fidelity, without placing a real call."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shaswat Sharma", email = "shaswatsharma28@gmail.com" }]
keywords = ["twilio", "media-streams", "voice", "websocket", "testing", "mulaw", "g711"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Telephony",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "numpy>=1.24",
  "websockets>=12.0",
  # Scenario files are a headline feature, not an add-on, so PyYAML is a base
  # dependency rather than an extra. It is small and ubiquitous, and gating a
  # documented capability behind an extra is friction that buys nothing.
  "pyyaml>=6.0",
]

[project.optional-dependencies]
resample = ["soxr>=0.3.7"]
# Just what examples/echo_agent.py needs. Someone with no voice agent of their
# own installs this to have something to call, and without it the first command
# in the README's quickstart is a ModuleNotFoundError.
example = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "soxr>=0.3.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",  # fastapi.testclient
  "pytest-timeout>=2.3",
]

[project.scripts]
streamdouble = "streamdouble.cli:main"

# Installing the package is enough to get the fixtures -- no pytest_plugins
# line to add, which is one less step between someone installing this and
# writing their first test.
[project.entry-points.pytest11]
streamdouble = "streamdouble.pytest_plugin"

[project.urls]
Homepage = "https://github.com/shaswat28/streamdouble"
Issues = "https://github.com/shaswat28/streamdouble/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/streamdouble"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  # Warnings are errors: several real bugs in this package surfaced first as a
  # warning, and a suite that tolerates them would have missed those.
  "error",
  # Third-party only, and each one is load-bearing to ignore rather than merely
  # noisy. uvicorn's websockets implementation calls the legacy websockets
  # server API, which warns about its own handler signature -- as an error that
  # aborts the WebSocket handshake, which killed every session test with a
  # connection timeout that looked nothing like its cause.
  "ignore:remove second argument of ws_handler:DeprecationWarning",
  "ignore:websockets.legacy is deprecated:DeprecationWarning",
  "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
  # audioop announces its own removal on import. Only the codec parity test
  # imports it, and only to check this package does not need it.
  "ignore:'audioop' is deprecated:DeprecationWarning",
  # pytest-asyncio builds a fresh event loop per test. On Windows a
  # ProactorEventLoop owns a self-pipe socketpair, and tearing down hundreds of
  # them leaves the occasional one for the garbage collector, which surfaces as
  # an unraisable ResourceWarning -- reported against whichever unrelated test
  # happened to be running when GC fired.
  #
  # Ignored only after measuring that it is not ours: 20 consecutive in-process
  # calls, each under its own asyncio.run, leave zero unclosed loops and no
  # socket growth at all. That measurement is kept as
  # tests/test_no_resource_leaks.py rather than being a one-off.
  #
  # Stated precisely, because the honest version is weaker than the tidy one:
  # those tests are regression *guards*, not mutation-verified detectors. No
  # mutation could be constructed that they catch -- deleting one
  # `connection.close()` is covered by another, and deleting all three makes
  # calls hang rather than leak. They pin "this does not grow", which is what
  # the warning was accidentally providing and is worth keeping; they are not
  # proof that every future leak is catchable.
  # Narrow on purpose: these two messages and no others. An unraisable
  # exception of any other shape still fails the suite, which is the whole
  # reason unraisable reporting is worth having.
  # The `.` after "in" matches the colon: pytest splits these filter strings on
  # ":", so a literal colon in the message pattern would end the field early.
  "ignore:Exception ignored in. <function BaseEventLoop.__del__:pytest.PytestUnraisableExceptionWarning",
  "ignore:Exception ignored in. <socket.socket:pytest.PytestUnraisableExceptionWarning",
]
