name: Release

# Deliberately manual. There is no push or tag trigger, so nothing publishes by
# accident while the project is still private: a release happens because someone
# went to the Actions tab and asked for one.
#
# `publish: false` is the default, so the ordinary run builds the artifacts,
# validates them, and installs the wheel into a clean environment without
# uploading anything. That is worth doing on its own -- it is the check that
# caught PyYAML being used but never declared, which passed every local test and
# failed on a machine that did not already have it.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually upload to PyPI (leave false to build and verify only)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Install the wheel into a clean environment
        # The point is what is *not* here: no dev extras, no editable install,
        # nothing the repository checkout would otherwise provide. If a runtime
        # dependency is undeclared, this is where it shows.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/streamdouble --version
          /tmp/clean/bin/python -c "
          import importlib, streamdouble
          # Every shipped module except pytest_plugin, which imports pytest and
          # is only ever loaded through the pytest11 entry point. Listing them
          # explicitly rather than naming a handful: this check previously
          # imported five modules and the package has fifteen, so four of the
          # newest could have been broken and released regardless.
          for name in [
              'aggregate', 'api', 'audio', 'baseline', 'chaos', 'cli', 'g711',
              'metrics', 'pacer', 'protocol', 'scenario', 'session', 'trace',
          ]:
              importlib.import_module('streamdouble.' + name)
          print('all modules import:', streamdouble.__version__)
          from streamdouble import audio
          print(len(audio.wav_to_ulaw_frames('fixtures/speech_8k.wav')), 'frames')
          "

      - name: The version being published is the one in the source
        # A wheel whose filename and __version__ disagree is confusing in
        # exactly the situation where someone is working out what they have.
        run: |
          SOURCE=$(/tmp/clean/bin/python -c "import streamdouble; print(streamdouble.__version__)")
          test -f "dist/streamdouble-$SOURCE.tar.gz" || {
            echo "no sdist for version $SOURCE; dist/ holds:" >&2
            ls dist/ >&2
            exit 1
          }
          echo "publishing $SOURCE"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        if: ${{ inputs.publish }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN is not set in this repository's secrets." >&2
            echo "Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          python -m twine upload dist/*
